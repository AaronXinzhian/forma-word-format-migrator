name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-strings:
    name: 界面文案单一来源同步性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 生成物一旦被手工改过，这里就会红，避免有人绕开 shared/ui-strings.json 直接改两端常量。
      - name: 校验生成的 UIStrings 与 shared/ui-strings.json 同步
        run: python3 scripts/gen_ui_strings.py --check

  python-tests:
    name: 文档引擎回归 (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.13'
          # Windows 便携包内置 Python 3.14.x（见 scripts/build_windows_app.sh）。
          # 引擎此前从未在 Windows 上跑过自动化测试，先以非阻断方式收集结果。
          - os: windows-latest
            python-version: '3.14'
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 运行回归测试
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  swift-checks:
    name: Mac 客户端编译与行为测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 收集 Swift 源文件
        id: sources
        run: |
          echo "list=$(find swift-app -name '*.swift' | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # 每个测试自带 @main，只能各编各的可执行文件。
      - name: 编译并运行 Swift 行为测试
        run: |
          mkdir -p build/ci
          for suite in PackDeletionPolicyTests LibraryLocationTests; do
            xcrun swiftc \
              -parse-as-library \
              -D WORD_FORMAT_LIBRARY_TESTING \
              -target arm64-apple-macos13.0 \
              -module-cache-path "build/ci/module-cache-${suite}" \
              ${{ steps.sources.outputs.list }} \
              "tests/${suite}.swift" \
              -o "build/ci/${suite}"
            "./build/ci/${suite}"
          done

      - name: 交叉架构编译检查（Release 构型）
        run: |
          for target in arm64-apple-macos13.0 x86_64-apple-macos13.0; do
            xcrun swiftc \
              -O \
              -parse-as-library \
              -target "$target" \
              -module-cache-path "build/ci/module-cache-${target}" \
              ${{ steps.sources.outputs.list }} \
              -o "build/ci/WordFormatLibrary-${target}"
          done

  windows-build:
    name: Windows 客户端编译与删除策略测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 编译 WinForms 客户端
        run: dotnet build windows-app/FormaFushi.Windows/FormaFushi.Windows.csproj -c Release

      # 与 macOS 侧 tests/PackDeletionPolicyTests.swift 的 12 项检查一一对应。
      # --strict 禁止「本机不支持所以跳过」，CI 上符号链接与回收站都必须真的跑过。
      - name: 运行 WindowsPackDeletionPolicyTests
        run: dotnet run --project tests/WindowsPackDeletionPolicyTests/WindowsPackDeletionPolicyTests.csproj -c Release -- --strict

      # 冒烟工具需要打包后的 runtime/ resources/ smoke-fixtures/ 布局才能运行，
      # CI 里只做编译检查，实际执行仍依赖 scripts/build_windows_app.sh 的产物。
      - name: 编译 Windows 冒烟工具
        run: dotnet build tests/WindowsSmokeHarness/WindowsSmokeHarness.csproj -c Release
